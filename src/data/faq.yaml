# Frequently asked questions shown on About → FAQ.
#
# How to edit:
#   - Each entry has a `question` and an `answer`.
#   - Keep the "answer: |" line, and indent every line of the answer by 6 spaces.
#   - Leave a blank line between paragraphs of an answer.
#   - Questions appear in the order listed here.

questions:
  - question: Under whose authority does our chapel operate?
    answer: |
      Saint Francis Mission Chapel is affiliated with the Society of Saint Pius X (SSPX), but the
      SSPX does not govern its operations and assumes no legal obligations on its behalf. Our
      priest, Fr. David Mary, is affiliated with the SSPX, and the chapel is served by the
      Traditional Capuchin Friars Minor, an independent Capuchin-Franciscan community.

      The chapel is operated by Una Voce Tennessee, a federally recognized 501(c)(3) nonprofit
      organization, doing business as Saint Francis Mission Chapel.

  - question: What is a mission chapel?
    answer: |
      A mission chapel is one where a priest of the Society does not live on site, but is cared
      for by a priest from outside an SSPX priory.

  - question: Are donations to Saint Francis Mission Chapel tax-deductible?
    answer: |
      Yes. Saint Francis Mission Chapel is operated by Una Voce Tennessee, a federally recognized
      501(c)(3) nonprofit organization, doing business as Saint Francis Mission Chapel. Donations
      to Saint Francis Mission Chapel are tax-deductible to the extent permitted by law.

      All charitable contributions are received and administered by Una Voce Tennessee in support
      of the chapel's religious mission and operations.

  - question: Is Saint Francis Mission Chapel open to visitors?
    answer: |
      Absolutely. All are welcome to attend Holy Mass and experience the beauty and reverence of
      traditional Catholic worship. Whether you are a lifelong Catholic or just curious about the
      traditional Latin Mass, we welcome your visit. Please contact the parish office to confirm
      Mass times and locations.

  - question: What should I expect at my first Traditional Latin Mass?
    answer: |
      The Holy Sacrifice of the Mass is, first and foremost, the worship of Almighty God. For those
      assisting at the Traditional Latin Mass for the first time, much may seem unfamiliar. This is
      to be expected. The Mass is celebrated almost entirely in Latin, many of the prayers are said
      quietly by the priest, and there are periods of profound silence.

      Do not be discouraged if you do not understand every prayer or ceremony, and do not concern
      yourself with perfectly following every action of the priest. It is wise not to judge the
      liturgy by the impressions of a single visit. Its beauty often unfolds gradually.

      Our Visiting for the First Time page explains all of this in more detail.

  - question: Why is the Mass in Latin? Do I need to understand it?
    answer: |
      Latin is the sacred liturgical language of the Roman Church. It serves as a visible expression
      of the unity and continuity of the Catholic faith across nations and centuries, and helps
      preserve the sacred character of the liturgy.

      You are not expected to understand every Latin prayer immediately. Missals may be used to
      follow the priest; these ordinarily contain the prayers of the Mass in both Latin and English.
      Certain prayers, known as the Propers, change according to the feast or liturgical day and may
      not be included in simpler missals. There is no need to be troubled by this. It is not
      necessary for everyone to follow every word or action in order to assist fruitfully at Holy
      Mass.

  - question: Why is so much of the Mass silent?
    answer: |
      Many of the prayers, particularly those of the Sacred Canon, are recited quietly by the
      priest. This silence is deliberate. It expresses the awe, humility, and adoration with which
      we should approach the Sacred Mysteries.

      The faithful are encouraged to unite themselves interiorly to the prayers of the priest,
      meditate upon the Passion of Our Lord, and offer their own intentions in union with the Holy
      Sacrifice. Silence in the presence of God is not emptiness. It is an act of reverence and an
      invitation to prayer.

  - question: When do I stand, sit, and kneel?
    answer: |
      There is no need for concern. Simply observe the congregation and follow their example. It may
      be helpful to sit toward the rear of the chapel, where the actions of others may be more
      easily observed.

  - question: How do I participate if I am not saying the prayers aloud?
    answer: |
      Participation in the Traditional Latin Mass is principally interior. The faithful are not
      required to recite every prayer aloud or follow every movement of the priest.

      Our participation consists above all in uniting our hearts and minds to the Sacrifice being
      offered, adoring Our Lord truly present upon the altar, and offering ourselves to God in union
      with His Divine Son. At certain moments, the most fitting participation is simply to kneel in
      silence and adore.

  - question: Why does the priest face the altar instead of the people?
    answer: |
      This traditional orientation is known as ad orientem, or "toward the East." It is sometimes
      mistakenly understood as the priest turning his back upon the faithful. In reality, priest and
      people are united in a common direction of worship, turned toward Almighty God.

  - question: Will there be music at Mass?
    answer: |
      At the Sung Mass, Gregorian chant and traditional sacred polyphony give voice to the Church's
      prayers. At a Low Mass, there may be no music at all. Whether accompanied by sacred chant or
      offered in near silence, the Holy Sacrifice remains the same.

  - question: What should I wear to Mass?
    answer: |
      Traditional standards of modest and dignified attire are expected.

      Men should wear dress trousers and dress shirts. Ties, suit coats, and other formal attire are
      common and appropriate. Jeans, shorts, T-shirts, and other overly casual clothing are not
      appropriate for assisting at Holy Mass. Men are also expected to remove hats and other head
      coverings upon entering the chapel.

      Women should wear modest dresses or skirts reaching at least to the knee, together with tops
      that adequately cover the shoulders and neckline. In keeping with the traditional custom of
      the Church, women ordinarily wear a chapel veil or another modest head covering while in
      church.

  - question: How should I conduct myself in the chapel?
    answer: |
      Before entering the pew, it is customary to genuflect toward the tabernacle in acknowledgment
      of the Real Presence of Our Lord in the Blessed Sacrament. Those physically unable to genuflect
      may make a reverent bow.

      Silence should be observed within the chapel, particularly before and after Holy Mass.
      Conversations and social greetings should be reserved for outside the chapel. Mobile phones
      and other electronic devices should be silenced and put away.

  - question: Are children welcome?
    answer: |
      Yes. The presence of children is a blessing, and families are an important part of parish
      life. Parents are encouraged to teach their children the importance of reverence in church,
      according to their age and ability.

  - question: Can I receive Holy Communion?
    answer: |
      Holy Communion is reserved for baptized, practicing Catholics who are properly disposed and
      in a state of grace.

      To receive Holy Communion, one must be living in accordance with the teachings of the
      Catholic Church and have received the Sacrament of Confession after any mortal sin. One must
      also observe the Eucharistic fast of at least one hour before receiving Communion. Water and
      medicine do not break this fast.

      Above all, one should approach the Blessed Sacrament with faith, reverence, and a sincere
      desire to receive the Body, Blood, Soul, and Divinity of Our Lord Jesus Christ.

      At our chapel, Holy Communion is received kneeling at the altar rail (unless a physical
      impediment prevents kneeling) and directly upon the tongue, according to the traditional
      practice of the Church. The Sacred Host is placed upon the tongue by the priest. Communicants
      do not extend their hands to receive and do not respond "Amen," as the priest recites the
      traditional formula of administration.

      Those who are not Catholic, who are not properly disposed, or who do not intend to receive
      Holy Communion should remain in their pews, and may use this sacred time to adore Our Lord
      and make an act of spiritual communion.

  - question: Do I have to receive Holy Communion?
    answer: |
      No. There is no expectation that every person present must receive Communion at every Mass.
      The obligation of the faithful is to assist at Holy Mass on Sundays and holy days of
      obligation, while the reception of Holy Communion is governed by its own requirements.

      The decision to refrain from receiving when one is not properly prepared is itself an act of
      reverence toward the Blessed Sacrament.
