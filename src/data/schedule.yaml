# The REGULAR weekly schedule shown on the home page.
#
# One-time changes (a cancelled Mass, a feast-day time) go in the Google Calendar,
# NOT here. Only edit this file when the normal week changes.
#
# How to edit (see CONTENT_GUIDE.md for screenshots-free step-by-step help):
#   - Keep the indentation (spaces, not tabs) exactly as it is.
#   - Put text that contains a colon (:) inside "quotes", e.g. "10:00 AM".
#   - Leave `time: ""` empty if there is no set time.
#   - `confirmed: false` means the entry still needs checking. Change to true once checked.
#   - If you make a mistake, the site build stops with a message saying which line is wrong;
#     the old version of the site stays online until it's fixed.

